<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg_e3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gardner_roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>
  <!-- Background Circle & Celebratory Golden-Green Ring -->
  <circle cx="128" cy="128" r="120" fill="url(#bg_e3)" stroke="#10b981" stroke-width="8"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8,6"/>

  <!-- Suburban Two-Story Family House -->
  <rect x="64" y="112" width="128" height="92" rx="8" fill="#fed7aa" stroke="#78350f" stroke-width="4"/>
  <!-- Steep Pitched Rooftop -->
  <polygon points="46,116 128,42 210,116" fill="url(#gardner_roof)" stroke="#450a0a" stroke-width="5"/>

  <!-- The Famous Rooftop Chimney Baby Slide (from the movie!) -->
  <rect x="150" y="52" width="34" height="48" rx="4" fill="#991b1b" stroke="#450a0a" stroke-width="3"/>
  <!-- Baby Delivery Chute Funnel atop Chimney -->
  <polygon points="144,52 190,52 184,36 150,36" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
  <circle cx="167" cy="44" r="5" fill="#f43f5e"/>

  <!-- Warm Windows with Silhouettes of Mom, Dad & Nate -->
  <rect x="78" y="130" width="38" height="34" rx="4" fill="#fef08a" stroke="#b45309" stroke-width="3"/>
  <circle cx="97" cy="144" r="6" fill="#78350f"/>
  <path d="M88 160 C88 152, 106 152, 106 160 Z" fill="#78350f"/>

  <!-- Front Welcome Porch -->
  <rect x="134" y="142" width="44" height="62" rx="4" fill="#9a3412" stroke="#78350f" stroke-width="3"/>
  <circle cx="142" cy="174" r="4" fill="#facc15"/>

  <!-- Golden Mission Accomplished Star -->
  <circle cx="128" cy="40" r="22" fill="#f59e0b" stroke="#fef08a" stroke-width="4"/>
  <polygon points="128,26 133,36 144,36 135,43 138,54 128,47 118,54 121,43 112,36 123,36" fill="#fff"/>
</svg>