<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg_s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="crane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <!-- Background Circle & Industrial Orange Glow Ring -->
  <circle cx="128" cy="128" r="120" fill="url(#bg_s2)" stroke="#f97316" stroke-width="8"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Mountain Canyon Cliffs in Background -->
  <polygon points="20,190 70,120 120,190" fill="#292524"/>
  <polygon points="136,190 186,110 236,190" fill="#292524"/>

  <!-- Suspension Waypoint Tower & Crane Arm -->
  <rect x="116" y="70" width="24" height="120" rx="3" fill="url(#crane)" stroke="#7c2d12" stroke-width="3"/>
  <line x1="116" y1="90" x2="140" y2="110" stroke="#7c2d12" stroke-width="2"/>
  <line x1="140" y1="90" x2="116" y2="110" stroke="#7c2d12" stroke-width="2"/>
  <line x1="116" y1="130" x2="140" y2="150" stroke="#7c2d12" stroke-width="2"/>
  <line x1="140" y1="130" x2="116" y2="150" stroke="#7c2d12" stroke-width="2"/>

  <!-- Horizontal Crane Boom -->
  <polygon points="50,66 190,66 170,82 60,82" fill="url(#crane)" stroke="#7c2d12" stroke-width="3"/>
  <!-- Support Cables -->
  <line x1="128" y1="46" x2="60" y2="66" stroke="#fed7aa" stroke-width="3"/>
  <line x1="128" y1="46" x2="180" y2="66" stroke="#fed7aa" stroke-width="3"/>

  <!-- Hanging Cargo Winch & Container -->
  <line x1="75" y1="82" x2="75" y2="124" stroke="#fed7aa" stroke-width="3"/>
  <rect x="55" y="124" width="40" height="34" rx="4" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>
  <rect x="63" y="132" width="24" height="6" fill="#fff"/>

  <!-- Outpost Beacon Strobe -->
  <circle cx="128" cy="44" r="14" fill="#facc15" stroke="#fff" stroke-width="3"/>
  <polygon points="128,34 131,42 139,42 133,47 135,55 128,50 121,55 123,47 117,42 125,42" fill="#b45309"/>

  <!-- Bridge Platform Deck -->
  <rect x="36" y="184" width="184" height="20" rx="4" fill="#57534e" stroke="#292524" stroke-width="3"/>
  <line x1="36" y1="194" x2="220" y2="194" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10,8"/>
</svg>