<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="p3_body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.5"/>
  </filter>
  <g filter="url(#sh3)">
    <!-- Aerodynamic Capsule Pod -->
    <rect x="28" y="32" width="72" height="64" rx="20" fill="url(#p3_body)" stroke="#312e81" stroke-width="4"/>
    <!-- Central Porthole Glass with Glowing Core -->
    <circle cx="64" cy="64" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="64" cy="64" r="14" fill="#06b6d4"/>
    <circle cx="64" cy="64" r="8" fill="#e0f2fe"/>
    <!-- Pressurized Latch Straps -->
    <line x1="28" y1="52" x2="100" y2="52" stroke="#4f46e5" stroke-width="3"/>
    <line x1="28" y1="76" x2="100" y2="76" stroke="#4f46e5" stroke-width="3"/>
    <!-- Top Carry Handle -->
    <path d="M48 32 C48 18, 80 18, 80 32" fill="none" stroke="#312e81" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>