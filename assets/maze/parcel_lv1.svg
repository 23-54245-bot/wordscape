<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="p1_box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.5"/>
  </filter>
  <g filter="url(#shadow)">
    <!-- 3D Parcel Box Top/Side -->
    <polygon points="64,18 106,38 64,58 22,38" fill="#f59e0b" stroke="#78350f" stroke-width="3"/>
    <polygon points="22,38 64,58 64,106 22,86" fill="url(#p1_box)" stroke="#78350f" stroke-width="3"/>
    <polygon points="64,58 106,38 106,86 64,106" fill="#b45309" stroke="#78350f" stroke-width="3"/>
    <!-- Yellow Shipping Straps -->
    <polygon points="43,28 85,48 80,50 38,30" fill="#fef08a"/>
    <polygon points="41,48 45,46 45,95 41,97" fill="#fef08a"/>
    <polygon points="85,48 81,46 81,95 85,97" fill="#fef08a"/>
    <!-- Delivery Stork Stamp -->
    <circle cx="78" cy="74" r="8" fill="#ef4444"/>
    <path d="M75 74 L78 70 L81 74 Z" fill="#fff"/>
  </g>
</svg>